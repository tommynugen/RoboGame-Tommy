# Runs the installers on fresh machines: Ubuntu 22.04, 24.04 and 26.04
# with ROS, Arch with ROS from arch4edu and without ROS, ROS in a distrobox (as on Arch), Linux
# without ROS, and Windows with and without ROS. Each then starts the app
# and asks it for /api/app.
name: install
on:
  pull_request:
    paths: [install.sh, install.ps1, scripts/desktop/**, .github/workflows/install.yml]
  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: install.sh
        run: bash install.sh --no-menu --no-cloudflared
      - name: App starts with ROS
        shell: bash
        run: |
          set +u; source /opt/ros/$(cat ~/.config/robogame/ros_distro)/setup.bash; source install/setup.bash
          timeout 20 ros2 run robogame_sim robogame_gamemaster --no-browser > gm.log 2>&1 &
          sleep 12; curl -sf http://localhost:8766/api/app | tee app.json
          grep -q '"console": true' app.json || { cat gm.log; exit 1; }

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: install.sh (ROS 2 from arch4edu)
        run: bash install.sh --no-menu --no-cloudflared
      - name: App starts with ROS
        shell: bash
        run: |
          set +u; source /opt/ros/$(cat ~/.config/robogame/ros_distro)/setup.bash; source install/setup.bash
          timeout 20 ros2 run robogame_sim robogame_gamemaster --no-browser > gm.log 2>&1 &
          sleep 12; curl -sf http://localhost:8766/api/app | tee app.json
          grep -q '"console": true' app.json || { cat gm.log; exit 1; }

  distrobox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install.sh --box
        run: bash install.sh --box --no-menu --no-cloudflared
      - name: App starts with ROS in the box
        run: |
          distrobox enter robogame -- bash -c 'set +u; source /opt/ros/lyrical/setup.bash; source install/setup.bash; timeout 25 ros2 run robogame_sim robogame_gamemaster --no-browser' > gm.log 2>&1 &
          sleep 18; curl -sf http://localhost:8766/api/app | tee app.json
          grep -q '"console": true' app.json || { cat gm.log; exit 1; }

  no-ros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "archlinux:latest"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: install.sh --no-ros
        run: bash install.sh --no-ros --no-menu --no-cloudflared
      - name: App starts
        shell: bash
        run: |
          cd src/robogame_sim
          timeout 15 ../../.venv/bin/python -m robogame_sim.gamemaster --no-browser > gm.log 2>&1 &
          sleep 8; python3 -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8766/api/app').read()[:200])" || { cat gm.log; exit 1; }

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        ros: [no, yes]
    env:
      ROBOGAME_REPO: ${{ github.repository }}
      ROBOGAME_REF: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: install.ps1
        shell: pwsh
        run: |
          if ("${{ matrix.ros }}" -eq "no") { $env:ROBOGAME_NO_ROS = "1" } else { $env:ROBOGAME_ROS = "1" }
          irm "https://raw.githubusercontent.com/$env:ROBOGAME_REPO/$env:ROBOGAME_REF/install.ps1" | iex
      - name: App starts
        shell: pwsh
        run: |
          $home_ = Join-Path $env:LOCALAPPDATA "RoboGame"
          if ("${{ matrix.ros }}" -eq "no") {
            $p = Start-Process -PassThru -FilePath "$home_\venv\Scripts\python.exe" -ArgumentList "`"$home_\gamemaster.pyw`"", "--no-browser" -RedirectStandardError gm.log
          } else {
            $p = Start-Process -PassThru -FilePath cmd.exe -ArgumentList "/c", "`"$home_\gamemaster.bat`" --no-browser" -RedirectStandardOutput gm.log -RedirectStandardError gm.err
          }
          Start-Sleep 25
          try { $app = Invoke-RestMethod http://localhost:8766/api/app } catch { Get-Content gm.log, gm.err -ErrorAction SilentlyContinue; throw }
          $app | ConvertTo-Json -Compress
          if ("${{ matrix.ros }}" -eq "yes" -and -not $app.console) { Get-Content gm.log, gm.err -ErrorAction SilentlyContinue; throw "robot console is off" }
          if (-not (Test-Path "$([Environment]::GetFolderPath('Programs'))\RoboGame Gamemaster.lnk")) { throw "no shortcut" }
          taskkill /T /F /PID $p.Id
